spring.application.name=fls

server.port=8445

spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.liquibase.change-log=classpath:liquibase/changelog-master.xml

airport.service.url=
flightlog.oauth2.server.url=
flightlog.oauth2.client.id=
flightlog.oauth2.client.secret=
flightlog.pending.service.url=


build.timestamp=
build.version=

keycloak.username-attribute=

application.security.corsFilter.corsUrlsToAllow=
application.security.corsFilter.corsMaxAgeInSecs=0

# Email
spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

application.email.airportIdentifierTaskNotificationFrom=
application.email.airportIdentifierTaskNotificationTo=

application.security.actuator.username=username
application.security.actuator.password=password

remote.api.call.retry.max.attempts=15
remote.api.call.retry.delay=30000
remote.api.call.retry.multiplier=2
remote.api.call.retry.max.delay=491520000
