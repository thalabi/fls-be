spring.application.name=fls

server.port=8445

spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.liquibase.change-log=classpath:liquibase/changelog-master.xml

airport.service.url=
airport.service.jwt.server.url=
airport.service.jwt.client.id=
airport.service.jwt.client.secret=


build.timestamp=
build.version=

keycloak.username-attribute=

application.security.corsFilter.corsUrlsToAllow=
application.security.corsFilter.corsMaxAgeInSecs=0

# Email
spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

application.email.airportIdentifierTaskNotificationFrom=
application.email.airportIdentifierTaskNotificationTo=
